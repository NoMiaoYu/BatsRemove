# Gradle JVM settings
org.gradle.jvmargs=-Xmx2G

# Minecraft 26.x is un-obfuscated: no mappings needed (matches Fabric API's own 26.2 build).
minecraft_version=26.2
loader_version=0.18.4
fabric_version=0.158.0+26.2

# Loom: tell it this environment is un-obfuscated (use built-in Mojang names, no mappings/remap).
fabric.loom.disableObfuscation=true

mod_version=1.0.0
maven_group=com.batsremove
archives_base_name=batsremove-26
